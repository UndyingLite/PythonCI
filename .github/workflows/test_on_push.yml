name: Python CI Workflow on macOS

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest  # Use the macOS virtual environment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Update version if needed

      # Install dependencies (this step will work with an empty requirements.txt)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests using pytest (if test file exists; otherwise, it will complete without errors)
      - name: Run Tests
        run: |
          pytest
